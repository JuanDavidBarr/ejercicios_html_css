<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini page</title>
    <style>
        article{
            display: block;
        }
        table, th, td{
            border: 3px double;
            border-collapse: collapse;
        }
    </style>

</head>
<body>
    <h1>Mini page with a table, a list and a organized block</h1>
    <section>
        <article>
            <table>
                <h2>Table</h2>
                <tr>
                    <th>Heading 1</th>
                    <th>Heading 2</th>
                    <th>Heading 3</th>
                    <th>Heading 4</th>
                    <th>Heading 5</th>
                </tr>
                <tr>
                    <td>cell 1</td>
                    <td>cell 2</td>
                    <td>cell 3</td>
                    <td>cell 4</td>
                    <td>cell 5</td>
                </tr>
                <tr>
                    <td>cell 6</td>
                    <td>cell 7</td>
                    <td>cell 8</td>
                    <td>cell 9</td>
                    <td>cell 10</td>
                </tr>
                <tr>
                    <td>cell 11</td>
                    <td>cell 12</td>
                    <td>cell 13</td>
                    <td>cell 14</td>
                    <td>cell 15</td>
                </tr>
            </table>
        </article>
        <article>
            <h2>List</h2>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>
                <li>Item 5</li>
            </ul>
        </article>
        
    </section>
</body>
</html>
